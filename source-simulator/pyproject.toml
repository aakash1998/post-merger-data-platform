[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmdp-source-simulator"
version = "0.1.0"
description = "Reproducible relational seed snapshots for approved PMDP source contracts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pmdp-seed = "retail_simulator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_simulator = ["schema.json"]
