[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmdp-source-simulator"
version = "0.1.0"
description = "Reproducible relational seed snapshots for approved PMDP source contracts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.8,<3"]
database = ["psycopg[binary]>=3.2,<4", "PyMySQL>=1.1,<2"]

[project.scripts]
pmdp-seed = "retail_simulator.__main__:main"
pmdp-change = "retail_simulator.continuous:main"
pmdp-event = "retail_simulator.events:main"
pmdp-scenario = "retail_simulator.scenarios:main"
pmdp-load = "retail_simulator.deployment:main"
pmdp-kafka-topics = "retail_simulator.kafka_topics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_simulator = ["schema.json", "ddl/*.sql"]
